
      - name: Diagnose and Build APK
        shell: bash
        run: |
          set -x
          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo "=== PROJECT FILES ==="
          ls -la
          echo "=== GRADLE FILES ==="
          find . -maxdepth 4 -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print
          echo "=== CHECK GRADLE WRAPPER ==="
          if [ ! -f ./gradlew ]; then
            echo "::error::gradlew is missing from the repository root"
            exit 1
          fi
          chmod +x ./gradlew
          echo "=== STARTING BUILD ==="
          ./gradlew assembleDebug --stacktrace --info
